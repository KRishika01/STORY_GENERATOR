<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Videos</title>
<style>
  :root {
    --bg: #fff7fa; --card: #ffffff; --ink: #2b2236; --muted: #7a6f88;
    --brand: #fb6f92; --brand-ink: #ffffff; --line: #f0dfe7;
    --ok: #1f9d55; --ok-bg: #e6f6ec; --bad: #d64545; --bad-bg: #fdeaea;
    --shadow: 0 4px 16px rgba(120, 60, 90, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17121d; --card: #221b2b; --ink: #f4eef8; --muted: #a79cb5;
      --line: #36293f; --ok-bg: #12301f; --bad-bg: #3a1a1a; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari",
                 "Noto Sans Telugu", "Noto Sans Tamil", Arial, sans-serif;
    line-height: 1.45; min-height: 100vh;
  }
  header { padding: 16px 20px; border-bottom: 1px solid var(--line); background: var(--card); }
  header a { color: var(--ink); text-decoration: none; font-weight: 700; font-size: 20px; }
  header a span { color: var(--brand); }
  main { max-width: 960px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; margin: 4px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 18px; }
  .hidden { display: none !important; }

  /* library */
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .card {
    display: flex; flex-direction: column; background: var(--card); border-radius: 14px;
    overflow: hidden; text-decoration: none; color: inherit; box-shadow: var(--shadow);
    border: 1px solid var(--line); transition: transform .12s ease;
  }
  .card:hover, .card:focus-visible { transform: translateY(-3px); outline: none; }
  .cover { aspect-ratio: 16 / 10; background: linear-gradient(135deg, #ffd1e0, #d9c8ff); position: relative; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .play {
    position: absolute; right: 10px; bottom: 10px; width: 40px; height: 40px; border-radius: 50%;
    background: rgba(0,0,0,.55); color: #fff; display: grid; place-items: center; font-size: 16px;
  }
  .card .body { padding: 12px 14px 14px; }
  .card h3 { margin: 0 0 6px; font-size: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }

  /* player */
  .back { display: inline-block; margin-bottom: 12px; color: var(--brand); text-decoration: none; font-weight: 600; }
  .stage { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; }
  video { width: 100%; max-height: 70vh; background: #000; display: block; }
  .stage-foot { padding: 12px 16px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

  button, .btn {
    font: inherit; cursor: pointer; border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600;
    background: var(--brand); color: var(--brand-ink); text-decoration: none; display: inline-block;
  }
  button.ghost, .btn.ghost { background: transparent; color: var(--brand); border: 1.5px solid var(--brand); }
  button:disabled { opacity: .45; cursor: not-allowed; }

  /* quiz */
  .quiz { padding: 20px 18px 22px; }
  .progress { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 8px 0 18px; }
  .progress > div { height: 100%; background: var(--brand); transition: width .25s ease; }
  .qmeta { color: var(--muted); font-size: 14px; display: flex; justify-content: space-between; }
  .qtext { font-size: 20px; font-weight: 700; margin: 6px 0 16px; }
  .opts { display: grid; gap: 10px; }
  .opt {
    text-align: left; background: var(--bg); color: var(--ink); border: 2px solid var(--line);
    padding: 13px 14px; display: flex; gap: 12px; align-items: center; font-weight: 500;
  }
  .opt:hover:not(:disabled) { border-color: var(--brand); }
  .opt .tag { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--card); border: 1.5px solid var(--line);
              display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--muted); }
  .opt.correct { background: var(--ok-bg); border-color: var(--ok); }
  .opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
  .opt.selected { border-color: var(--brand); background: var(--card); box-shadow: 0 0 0 2px var(--brand) inset; }
  .opt.selected .tag { background: var(--brand); color: #fff; border-color: var(--brand); }
  .review { text-align: left; margin-top: 22px; display: grid; gap: 12px; }
  .ritem { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--bg); }
  .ritem.ok { border-color: var(--ok); background: var(--ok-bg); }
  .ritem.bad { border-color: var(--bad); background: var(--bad-bg); }
  .ritem .rq { font-weight: 700; margin: 0 0 6px; }
  .ritem .ra { margin: 2px 0; font-size: 15px; }
  .ritem .ra b { font-weight: 700; }
  .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .result { text-align: center; padding: 18px 8px; }
  .result .big { font-size: 56px; margin: 0; }
  .result .score { font-size: 28px; font-weight: 800; margin: 6px 0; }
  .result .actions { justify-content: center; }

  /* captions + story reader */
  .capline { padding: 10px 16px; background: #000; color: #fff; text-align: center; font-size: 17px; min-height: 44px; }
  .reader { margin-top: 18px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
  .reader > button.toggle { width: 100%; text-align: left; background: transparent; color: var(--ink); border-radius: 16px;
                            padding: 14px 16px; display: flex; justify-content: space-between; font-size: 16px; }
  .reader .content { padding: 4px 16px 16px; display: grid; gap: 12px; }
  .scene { display: flex; gap: 14px; align-items: flex-start; padding: 10px; border-radius: 12px;
           border: 2px solid transparent; background: var(--bg); }
  .scene.seekable { cursor: pointer; }
  .scene.now { border-color: var(--brand); background: var(--card); box-shadow: 0 0 0 2px var(--brand) inset; }
  .scene img { width: 120px; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; flex: none; background: var(--line); }
  .scene p { margin: 0; font-size: 17px; }
  .storytext p { margin: 0 0 10px; font-size: 17px; }
  @media (max-width: 520px) { .scene { flex-direction: column; } .scene img { width: 100%; } }

  .state { text-align: center; color: var(--muted); padding: 48px 12px; }
</style>
</head>
<body>
<header><a href="#/" id="home">🎬 Story<span>Videos</span></a></header>

<main>
  <!-- LIBRARY -->
  <section id="library">
    <h1>Watch &amp; play</h1>
    <p class="sub">Pick a story, watch the video, then test what you remember.</p>
    <div id="grid" class="grid"></div>
    <div id="libState" class="state">Loading stories…</div>
  </section>

  <!-- PLAYER -->
  <section id="player" class="hidden">
    <a class="back" href="#/">← All stories</a>
    <h1 id="pTitle"></h1>
    <div class="chips" id="pChips" style="margin-bottom:14px"></div>

    <div class="stage">
      <div id="videoBox">
        <video id="video" controls playsinline preload="metadata"></video>
        <div id="capLine" class="capline hidden" aria-live="off"></div>
        <div class="stage-foot">
          <span class="sub" style="margin:0">The quiz opens when the video ends.</span>
          <span>
            <button class="ghost hidden" id="ccBtn" type="button">Captions: On</button>
            <button class="ghost" id="skipToQuiz" type="button">Take the quiz now</button>
          </span>
        </div>
      </div>
      <div id="quizBox" class="quiz hidden"></div>
    </div>
    <div id="reader" class="reader hidden">
      <button class="toggle" id="readerToggle" type="button" aria-expanded="false">
        <span>📖 Read the story</span><span id="readerArrow">▾</span>
      </button>
      <div id="readerContent" class="content hidden"></div>
    </div>
    <div id="playerState" class="state hidden"></div>
  </section>
</main>

<script>
(function () {
  "use strict";

  // Two ways to get data (chosen automatically):
  //  1) STATIC SITE: a data.json file sitting next to this page (made by export_snapshot.py). No backend needed.
  //  2) LIVE API: the FastAPI backend (same server that serves /watch, or watch.html?api=https://your-backend).
  var API = (new URLSearchParams(location.search).get("api") || window.WATCH_API_BASE || "").replace(/\/$/, "");

  function liveGet(path) {
    return fetch(API + "/watch/api" + path).then(function (r) {
      if (!r.ok) { var e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
      return r.json();
    });
  }

  var snapshotP = null;
  function loadSnapshot() {
    if (API) return Promise.resolve(null);          // an explicit ?api= always means "use the live backend"
    if (!snapshotP) {
      snapshotP = fetch("data.json", { cache: "no-cache" })
        .then(function (r) { if (!r.ok) throw 0; return r.json(); })
        .then(function (d) { if (!d || !Array.isArray(d.stories)) throw 0; return d; })
        .catch(function () { return null; });         // no data.json -> live API mode
    }
    return snapshotP;
  }

  function notFound() { var e = new Error("HTTP 404"); e.status = 404; return e; }

  function fromSnapshot(snap, path) {
    if (path === "/stories") return snap.stories.map(function (s) { return s.summary; });
    var m = path.match(/^\/stories\/([0-9a-fA-F]{24})(\/captions)?$/);
    var hit = m && snap.stories.filter(function (s) { return s.summary.id === m[1]; })[0];
    if (!hit) throw notFound();
    return m[2] ? { cues: hit.cues || [] } : { story: hit.story, quiz: hit.quiz };
  }

  function getJSON(path) {
    return loadSnapshot().then(function (snap) {
      return snap ? fromSnapshot(snap, path) : liveGet(path);
    });
  }
  // Only ever put http(s) URLs into src attributes.
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : ""; }
  function cap(s) { s = String(s || ""); return s ? s.charAt(0).toUpperCase() + s.slice(1) : ""; }

  // tiny DOM helper -- always uses textContent, so story titles / questions can't inject HTML
  function h(tag, attrs) {
    var el = document.createElement(tag);
    for (var k in (attrs || {})) {
      if (k === "class") el.className = attrs[k];
      else if (k === "text") el.textContent = attrs[k];
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), attrs[k]);
      else el.setAttribute(k, attrs[k]);
    }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null) continue;
      el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return el;
  }
  function $(id) { return document.getElementById(id); }
  function chips(story) {
    return [story.genre, cap(story.language)].filter(Boolean).map(function (t) { return h("span", { class: "chip", text: t }); });
  }

  /* ------------------------------ LIBRARY ------------------------------ */
  function showLibrary() {
    stopVideo();
    $("player").classList.add("hidden");
    $("library").classList.remove("hidden");
    document.title = "Story Videos";
    var grid = $("grid"), state = $("libState");
    grid.textContent = "";
    state.classList.remove("hidden");
    state.textContent = "Loading stories…";

    getJSON("/stories").then(function (stories) {
      if (!stories.length) { state.textContent = "No stories with quizzes yet. Check back soon!"; return; }
      state.classList.add("hidden");
      stories.forEach(function (s) {
        var cover = h("div", { class: "cover" });
        if (safeUrl(s.coverUrl)) cover.appendChild(h("img", { src: s.coverUrl, alt: "", loading: "lazy" }));
        cover.appendChild(h("div", { class: "play", text: "▶" }));
        var meta = chips(s);
        if (s.questionCount) meta.push(h("span", { class: "chip", text: s.questionCount + " questions" }));
        grid.appendChild(
          h("a", { class: "card", href: "#/story/" + encodeURIComponent(s.id) },
            cover, h("div", { class: "body" }, h("h3", { text: s.title }), h.apply(null, ["div", { class: "chips" }].concat(meta))))
        );
      });
    }).catch(function () {
      state.textContent = "Couldn't load stories. Please check your connection and refresh.";
    });
  }

  /* ------------------------------- PLAYER ------------------------------ */
  var current = null; // { story, quiz }
  var video = $("video");
  var cues = [], activeCue = -1, capsOn = true, sceneEls = [];

  function stopVideo() { try { video.pause(); } catch (e) {} }

  function showPlayer(id) {
    $("library").classList.add("hidden");
    $("player").classList.remove("hidden");
    $("videoBox").classList.add("hidden");
    $("quizBox").classList.add("hidden");
    $("pTitle").textContent = "";
    $("pChips").textContent = "";
    resetReader();
    var st = $("playerState");
    st.classList.remove("hidden");
    st.textContent = "Loading…";

    getJSON("/stories/" + encodeURIComponent(id)).then(function (data) {
      current = data;
      st.classList.add("hidden");
      document.title = data.story.title + " · Story Videos";
      $("pTitle").textContent = data.story.title;
      chips(data.story).forEach(function (c) { $("pChips").appendChild(c); });
      $("skipToQuiz").classList.toggle("hidden", !(data.quiz && data.quiz.questions.length));
      buildReader(data.story);
      watchAgain(true);
      // captions are optional: load them quietly, ignore any failure
      getJSON("/stories/" + encodeURIComponent(id) + "/captions").then(function (c) {
        if (current !== data || !c.cues || !c.cues.length) return;
        cues = c.cues;
        $("ccBtn").classList.remove("hidden");
        alignScenes();
      }).catch(function () {});
    }).catch(function (e) {
      st.textContent = e.status === 404 ? "This story isn't available." : "Couldn't load this story. Please try again.";
    });
  }

  function watchAgain(autoplay) {
    $("quizBox").classList.add("hidden");
    $("videoBox").classList.remove("hidden");
    var url = safeUrl(current.story.videoUrl);
    if (video.getAttribute("src") !== url) video.setAttribute("src", url);
    var poster = safeUrl(current.story.coverUrl);
    if (poster) video.setAttribute("poster", poster); else video.removeAttribute("poster");
    try { video.currentTime = 0; } catch (e) {}
    if (autoplay) { var p = video.play(); if (p && p.catch) p.catch(function () { /* autoplay blocked: user presses play */ }); }
  }

  /* ------------------- captions + "read the story" panel ------------------- */
  function resetReader() {
    cues = []; activeCue = -1; sceneEls = [];
    $("capLine").classList.add("hidden"); $("capLine").textContent = "";
    $("ccBtn").classList.add("hidden");
    $("reader").classList.add("hidden");
    $("readerContent").classList.add("hidden"); $("readerContent").textContent = "";
    $("readerToggle").setAttribute("aria-expanded", "false");
    $("readerArrow").textContent = "▾";
  }

  function buildReader(story) {
    var box = $("readerContent");
    if (story.scenes && story.scenes.length) {
      story.scenes.forEach(function (sc, n) {
        var row = h("div", { class: "scene" });
        if (safeUrl(sc.imageUrl)) row.appendChild(h("img", { src: sc.imageUrl, alt: "", loading: "lazy" }));
        row.appendChild(h("p", { text: sc.text }));
        row.addEventListener("click", function () { seekToScene(n); });
        sceneEls.push(row);
        box.appendChild(row);
      });
    } else if (story.storyText && story.storyText.trim()) {
      var wrap = h("div", { class: "storytext" });
      story.storyText.split(/\n+/).forEach(function (para) { if (para.trim()) wrap.appendChild(h("p", { text: para.trim() })); });
      box.appendChild(wrap);
    } else {
      return;               // nothing to read -> keep the panel hidden
    }
    $("reader").classList.remove("hidden");
  }

  // Captions map one-to-one onto scenes; only link them when the counts match.
  function aligned() { return cues.length > 0 && cues.length === sceneEls.length; }
  function alignScenes() { sceneEls.forEach(function (el) { el.classList.toggle("seekable", aligned()); }); }

  function seekToScene(n) {
    if (!aligned() || $("videoBox").classList.contains("hidden")) return;
    video.currentTime = cues[n].start;
    var p = video.play(); if (p && p.catch) p.catch(function () {});
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function paintCaption() {
    var line = $("capLine");
    var show = capsOn && cues.length && activeCue >= 0;
    line.classList.toggle("hidden", !(capsOn && cues.length));
    line.textContent = show ? cues[activeCue].text : "";
  }

  video.addEventListener("timeupdate", function () {
    if (!cues.length) return;
    var t = video.currentTime, idx = -1;
    for (var k = 0; k < cues.length; k++) { if (t >= cues[k].start && t < cues[k].end) { idx = k; break; } }
    if (idx === activeCue) return;
    activeCue = idx;
    paintCaption();
    if (aligned()) sceneEls.forEach(function (el, n) { el.classList.toggle("now", n === idx); });
  });

  $("ccBtn").addEventListener("click", function () {
    capsOn = !capsOn;
    $("ccBtn").textContent = "Captions: " + (capsOn ? "On" : "Off");
    paintCaption();
  });

  $("readerToggle").addEventListener("click", function () {
    var c = $("readerContent"), open = c.classList.contains("hidden");
    c.classList.toggle("hidden", !open);
    $("readerToggle").setAttribute("aria-expanded", String(open));
    $("readerArrow").textContent = open ? "▴" : "▾";
  });

  video.addEventListener("ended", openQuiz);
  $("skipToQuiz").addEventListener("click", openQuiz);

  /* -------------------------------- QUIZ ------------------------------- */
  function openQuiz() {
    stopVideo();
    var box = $("quizBox");
    $("videoBox").classList.add("hidden");
    box.classList.remove("hidden");
    var quiz = current && current.quiz;
    if (!quiz || !quiz.questions.length) {
      box.textContent = "";
      box.appendChild(h("div", { class: "result" },
        h("p", { class: "big", text: "🎉" }),
        h("p", { class: "score", text: "Hope you enjoyed it!" }),
        h("p", { class: "sub", text: "There's no quiz for this story yet." }),
        h("div", { class: "actions" }, h("button", { type: "button", onclick: function () { watchAgain(true); }, text: "Watch again" }))));
      return;
    }
    runQuiz(box, quiz.questions);
  }

  function runQuiz(box, questions) {
    var i = 0;
    var answers = questions.map(function () { return null; });   // chosen option index per question

    function question() {
      var q = questions[i], isLast = i === questions.length - 1;
      box.textContent = "";

      var prev = h("button", { type: "button", class: "ghost", text: "← Previous",
        onclick: function () { i--; question(); } });
      if (i === 0) prev.disabled = true;

      var next = h("button", { type: "button", text: isLast ? "Submit quiz" : "Next →",
        onclick: function () { if (isLast) finish(); else { i++; question(); } } });
      if (answers[i] === null) next.disabled = true;

      var opts = h("div", { class: "opts" });
      q.options.forEach(function (text, idx) {
        var btn = h("button", { type: "button", class: "opt" + (answers[i] === idx ? " selected" : "") },
          q.type !== "true_false" ? h("span", { class: "tag", text: String.fromCharCode(65 + idx) }) : null,
          h("span", { text: text }));
        btn.addEventListener("click", function () {
          answers[i] = idx;                       // can be changed any time before submitting
          var all = opts.querySelectorAll(".opt");
          for (var k = 0; k < all.length; k++) all[k].classList.toggle("selected", k === idx);
          next.disabled = false;
        });
        opts.appendChild(btn);
      });

      var answered = answers.filter(function (a) { return a !== null; }).length;
      box.appendChild(h("div", { class: "qmeta" },
        h("span", { text: "Question " + (i + 1) + " of " + questions.length }),
        h("span", { text: answered + " answered" })));
      box.appendChild(h("div", { class: "progress" }, h("div", { style: "width:" + ((i + 1) / questions.length * 100) + "%" })));
      box.appendChild(h("div", { class: "qtext", text: q.question }));
      box.appendChild(opts);
      box.appendChild(h("div", { class: "actions" }, prev, next));
    }

    function finish() {
      var score = 0;
      var review = h("div", { class: "review" });
      questions.forEach(function (q, n) {
        var correct = Number(q.answer), mine = answers[n];
        var right = mine === correct;
        if (right) score++;
        var item = h("div", { class: "ritem " + (right ? "ok" : "bad") },
          h("p", { class: "rq", text: (n + 1) + ". " + q.question }),
          h("p", { class: "ra" }, h("b", { text: (right ? "✅ " : "❌ ") + "Your answer: " }), mine === null ? "—" : q.options[mine]));
        if (!right) item.appendChild(h("p", { class: "ra" }, h("b", { text: "✔ Correct answer: " }), q.options[correct]));
        review.appendChild(item);
      });

      var pct = score / questions.length;
      var emoji = pct === 1 ? "🏆" : pct >= .7 ? "🌟" : pct >= .4 ? "👍" : "💪";
      var msg = pct === 1 ? "Perfect score!" : pct >= .7 ? "Great job!" : pct >= .4 ? "Good effort!" : "Keep practising — try again!";
      box.textContent = "";
      box.appendChild(h("div", { class: "result" },
        h("p", { class: "big", text: emoji }),
        h("p", { class: "score", text: score + " / " + questions.length }),
        h("p", { class: "sub", text: msg }),
        h("div", { class: "actions" },
          h("button", { type: "button", text: "Try the quiz again", onclick: function () {
            answers = questions.map(function () { return null; }); i = 0; question(); } }),
          h("button", { type: "button", class: "ghost", text: "Watch the video again", onclick: function () { watchAgain(true); } }),
          h("a", { class: "btn ghost", href: "#/", text: "More stories" })),
        review));
    }

    question();
  }

  /* ------------------------------- ROUTER ------------------------------ */
  function route() {
    var m = location.hash.match(/^#\/story\/([0-9a-fA-F]{24})$/);
    if (m) showPlayer(m[1]); else showLibrary();
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
